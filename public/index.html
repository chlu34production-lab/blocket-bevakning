<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocket Bevakning</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.topbar { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
.topbar h1 { font-size: 17px; font-weight: 600; }
.topbar span { font-size: 13px; color: #9ca3af; }
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 20px; margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
label { font-size: 13px; color: #6b7280; display: block; margin-bottom: 5px; margin-top: 12px; }
label:first-of-type { margin-top: 0; }
input[type="text"], input[type="url"], input[type="password"], select {
  width: 100%; padding: 9px 12px; border: 1px solid #e5e5e5; border-radius: 8px;
  font-size: 14px; background: #fafafa; outline: none; transition: border 0.15s;
}
input:focus, select:focus { border-color: #6366f1; background: #fff; }
.toggle-row { display: flex; gap: 8px; margin-top: 4px; }
.tog { flex: 1; padding: 9px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fafafa; cursor: pointer; font-size: 13px; font-weight: 500; text-align: center; transition: all 0.15s; color: #6b7280; }
.tog.on { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
.btn-start { width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.btn-start:hover { background: #4f46e5; }
.btn-stop { width: 100%; padding: 11px; background: #fff; color: #ef4444; border: 1.5px solid #fca5a5; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn-stop:hover { background: #fef2f2; }
.status { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
.status.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
.status.err { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }
.status.idle { background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: #22c55e; animation: blink 1.5s infinite; }
.dot.red { background: #ef4444; }
.dot.gray { background: #94a3b8; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; text-align: center; }
.stat-n { font-size: 24px; font-weight: 700; color: #6366f1; }
.stat-l { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.ads { display: grid; gap: 10px; }
.ad { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; display: flex; gap: 12px; animation: pop .3s ease; }
.ad.ny { border-color: #6ee7b7; background: #f0fdf4; }
@keyframes pop { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
.ad-img { width: 76px; height: 58px; object-fit: cover; border-radius: 7px; flex-shrink: 0; background: #f3f4f6; }
.ad-body { flex: 1; min-width: 0; }
.ad-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.ad-price { font-size: 15px; font-weight: 700; color: #059669; margin-bottom: 3px; }
.ad-meta { font-size: 12px; color: #9ca3af; }
.ad-meta a { color: #6366f1; text-decoration: none; }
.badge { display: inline-block; background: #d1fae5; color: #065f46; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
.empty-state { text-align: center; padding: 36px 16px; color: #9ca3af; font-size: 14px; }
.log-wrap { margin-top: 14px; }
.log-wrap summary { font-size: 12px; color: #9ca3af; cursor: pointer; padding: 4px 0; }
.log { background: #0f172a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; max-height: 130px; overflow-y: auto; margin-top: 6px; }
.l { margin-bottom: 3px; }
.l.ok { color: #4ade80; }
.l.info { color: #7dd3fc; }
.l.warn { color: #fb923c; }
</style>
</head>
<body>

<div class="topbar">
  <span style="font-size:20px">🔍</span>
  <h1>Blocket Bevakning</h1>
  <span>· Bevakar nya annonser i realtid</span>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">⚙️ Sökinställningar</div>
    <label>Blocket söklänk</label>
    <input type="url" id="url" placeholder="https://www.blocket.se/mobility/search/car?q=golf&..." />
    <label>Sökintervall</label>
    <select id="interval">
      <option value="2">Var 2:a minut (test)</option>
      <option value="5">Var 5:e minut</option>
      <option value="10">Var 10:e minut</option>
      <option value="15" selected>Var 15:e minut</option>
      <option value="30">Var 30:e minut</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">🔔 Notifieringar</div>
    <div class="toggle-row">
      <div class="tog" id="t-slack" onclick="tog('slack')">💬 Slack</div>
      <div class="tog" id="t-whatsapp" onclick="tog('whatsapp')">📱 WhatsApp</div>
    </div>
    <div id="c-slack" style="display:none">
      <label>Slack Webhook URL</label>
      <input type="text" id="slackUrl" placeholder="https://hooks.slack.com/services/..." />
    </div>
    <div id="c-whatsapp" style="display:none">
      <label>Twilio Account SID</label>
      <input type="text" id="tSid" placeholder="ACxxxxxxxxxxxxxxxx" />
      <label>Twilio Auth Token</label>
      <input type="password" id="tToken" placeholder="••••••••••••••••" />
      <label>Ditt WhatsApp-nummer (mottagare)</label>
      <input type="text" id="tTo" placeholder="+46701234567" />
      <label>Twilio sandbox-nummer (avsändare)</label>
      <input type="text" id="tFrom" placeholder="+14155238886" />
    </div>
  </div>

  <button class="btn-start" id="btnStart" onclick="start()">▶ Starta bevakning</button>
  <button class="btn-stop" id="btnStop" style="display:none" onclick="stop()">⏹ Stoppa bevakning</button>

  <div id="statusWrap" style="display:none; margin-top:14px;">
    <div class="status idle" id="statusEl">
      <div class="dot gray" id="dotEl"></div>
      <span id="statusTxt">Startar...</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="sNew">0</div><div class="stat-l">Nya annonser</div></div>
      <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Ignorerade</div></div>
      <div class="stat"><div class="stat-n" id="sChecks">0</div><div class="stat-l">Sökningar</div></div>
    </div>
    <div class="ads" id="adsEl">
      <div class="empty-state">Väntar på nya annonser...</div>
    </div>
    <div class="log-wrap">
      <details><summary>Visa logg</summary><div class="log" id="logEl"></div></details>
    </div>
  </div>
</div>

<script>
  const PROXY = "http://localhost:3000";
  let seen = new Set(), tid = null, checks = 0, news = 0, firstRun = true;
  let ch = { slack: false, whatsapp: false };

  function tog(k) {
    ch[k] = !ch[k];
    document.getElementById('t-' + k).classList.toggle('on', ch[k]);
    document.getElementById('c-' + k).style.display = ch[k] ? '' : 'none';
  }

  function log(msg, t = 'info') {
    const el = document.getElementById('logEl');
    const ts = new Date().toLocaleTimeString('sv-SE');
    el.innerHTML += `<div class="l ${t}">[${ts}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(msg, type = 'ok') {
    const el = document.getElementById('statusEl');
    el.className = 'status ' + type;
    document.getElementById('dotEl').className = 'dot ' + (type==='ok'?'green':type==='err'?'red':'gray');
    document.getElementById('statusTxt').textContent = msg;
  }

  function addAd(ad, isNew) {
    const grid = document.getElementById('adsEl');
    const empty = grid.querySelector('.empty-state');
    if (empty) empty.remove();
    const price = ad.price?.value ? parseInt(ad.price.value).toLocaleString('sv-SE') + ' kr' : 'Pris saknas';
    const link  = ad.share_url || 'https://www.blocket.se' + (ad.url || '');
    const img   = ad.images?.[0]?.url;
    const loc   = ad.location?.name || '';
    const ts    = ad.list_time ? new Date(ad.list_time).toLocaleString('sv-SE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const d = document.createElement('div');
    d.className = 'ad' + (isNew ? ' ny' : '');
    d.innerHTML = (img ? `<img class="ad-img" src="${img}?type=mob_iphone_vi_normal_2x" onerror="this.style.display='none'" alt="">` : `<div class="ad-img" style="display:flex;align-items:center;justify-content:center;font-size:26px;">🚗</div>`)
      + `<div class="ad-body">
          <div class="ad-title">${ad.subject || 'Okänd'}${isNew?'<span class="badge">NY</span>':''}</div>
          <div class="ad-price">${price}</div>
          <div class="ad-meta">${[loc,ts].filter(Boolean).join(' · ')} · <a href="${link}" target="_blank">Öppna ↗</a></div>
        </div>`;
    grid.insertBefore(d, grid.firstChild);
  }

  async function notifySlack(ad) {
    const wh = document.getElementById('slackUrl').value.trim();
    if (!wh) return;
    try {
      await fetch(`${PROXY}/api/notify/slack`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ webhook: wh, ad })
      });
      log('Slack ✓ ' + ad.subject, 'ok');
    } catch(e) { log('Slack fel: ' + e.message, 'warn'); }
  }

  async function notifyWA(ad) {
    const sid   = document.getElementById('tSid').value.trim();
    const token = document.getElementById('tToken').value.trim();
    const to    = document.getElementById('tTo').value.trim();
    const from  = document.getElementById('tFrom').value.trim();
    if (!sid||!token||!to||!from) return;
    const price = ad.price?.value ? parseInt(ad.price.value).toLocaleString('sv-SE') + ' kr' : 'Pris saknas';
    const link  = ad.share_url || 'https://www.blocket.se' + (ad.url || '');
    try {
      const r = await fetch(`${PROXY}/api/notify/whatsapp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sid, token, to, from, ad })
      });
      const data = await r.json();
      if (data.ok) log('WhatsApp ✓ ' + ad.subject, 'ok');
      else log('WhatsApp fel: ' + data.error, 'warn');
    } catch(e) { log('WhatsApp fel: ' + e.message, 'warn'); }
  }

  async function check() {
    const url = document.getElementById('url').value.trim();
    checks++;
    document.getElementById('sChecks').textContent = checks;
    log('Sökning #' + checks + ' ...');
    try {
      const r = await fetch(`${PROXY}/api/search?url=${encodeURIComponent(url)}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      const ads = data.data || [];

      if (firstRun) {
        ads.forEach(a => seen.add(a.ad_id || a.id));
        document.getElementById('sTotal').textContent = seen.size;
        log('Baslinje: ' + seen.size + ' annonser ignoreras', 'ok');
        firstRun = false;
        const mins = document.getElementById('interval').value;
        setStatus('Aktiv · nästa sökning om ' + mins + ' min');
        return;
      }

      const nytt = ads.filter(a => !seen.has(a.ad_id || a.id));
      nytt.forEach(a => {
        seen.add(a.ad_id || a.id);
        addAd(a, true);
        news++;
        document.getElementById('sNew').textContent = news;
        log('Ny annons: ' + a.subject, 'ok');
        if (ch.slack)    notifySlack(a);
        if (ch.whatsapp) notifyWA(a);
      });
      if (!nytt.length) log('Inga nya annonser.');
      const mins = document.getElementById('interval').value;
      setStatus('Aktiv · ' + news + ' nya · nästa om ' + mins + ' min');
    } catch(e) {
      log('Fel: ' + e.message, 'warn');
      setStatus('Fel vid hämtning – se logg', 'err');
    }
  }

  function start() {
    const url = document.getElementById('url').value.trim();
    if (!url.includes('blocket.se')) { alert('Ange en giltig Blocket-söklänk.'); return; }
    seen.clear(); checks=0; news=0; firstRun=true;
    ['sNew','sTotal','sChecks'].forEach(id => document.getElementById(id).textContent = 0);
    document.getElementById('adsEl').innerHTML = '<div class="empty-state">Väntar på nya annonser...</div>';
    document.getElementById('logEl').innerHTML = '';
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display  = 'block';
    document.getElementById('statusWrap').style.display = 'block';
    setStatus('Startar...', 'idle');
    check();
    const mins = parseInt(document.getElementById('interval').value);
    tid = setInterval(check, mins * 60 * 1000);
  }

  function stop() {
    clearInterval(tid); tid = null;
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnStop').style.display  = 'none';
    setStatus('Stoppad · ' + news + ' nya annonser hittades', 'idle');
    log('Bevakning stoppad.', 'warn');
  }

  async function loadConfig() {
    try {
      const r = await fetch(`${PROXY}/api/config`);
      const c = await r.json();
      if (c.twilioSid)    document.getElementById('tSid').value     = c.twilioSid;
      if (c.twilioToken)  document.getElementById('tToken').value   = c.twilioToken;
      if (c.twilioFrom)   document.getElementById('tFrom').value    = c.twilioFrom;
      if (c.twilioTo)     document.getElementById('tTo').value      = c.twilioTo;
      if (c.slackWebhook) document.getElementById('slackUrl').value = c.slackWebhook;
      if (c.twilioSid || c.twilioToken) {
        ch.whatsapp = true;
        document.getElementById('t-whatsapp').classList.add('on');
        document.getElementById('c-whatsapp').style.display = '';
      }
      if (c.slackWebhook) {
        ch.slack = true;
        document.getElementById('t-slack').classList.add('on');
        document.getElementById('c-slack').style.display = '';
      }
      console.log("✅ Inställningar laddade");
    } catch(e) { console.log("Ingen config hittad"); }
  }
  loadConfig();
</script>
</body>
</html>
